# Publica o site no GitHub Pages a cada envio ao repositório.
# Os preços não vêm daqui: a coleta roda no Supabase (supabase/coleta.sql) e o app lê de lá.
# Os JSON em publicado/api ficam só como reserva, caso o Supabase não responda.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Montar site
        run: node src/montar-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
