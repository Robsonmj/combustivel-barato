<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: radial-gradient(circle at 25% 45%, #FFE27A 0%, #FFD43B 55%, #F9C81E 100%); color: #001B44;
    display: flex; align-items: center; padding: 0 56px 0 36px; box-sizing: border-box; gap: 28px; }
  .simbolo { width: 380px; height: 300px; flex: none; }
  .simbolo svg { width: 100%; height: 100%; display: block; }
  h1 { font-size: 86px; margin: 0 0 8px; letter-spacing: -2px; line-height: 1; font-weight: 900; }
  h1 span { color: #05A81C; }
  p { font-size: 28px; margin: 0; line-height: 1.3; font-weight: 600; }
  .precos { display: flex; gap: 12px; margin-top: 24px; }
  .p { background: #001B44; color: #FFD43B; border-radius: 12px; padding: 8px 16px; font-weight: 800; font-size: 24px; }
  .p small { display: block; font-size: 14px; color: #c9d6e8; font-weight: 600; }
</style></head>
<body>
  <!-- o símbolo (marca/final/abastecer-simbolo-amarelo.svg, gatilho amarelo) é colocado aqui por ferramentas/capturas.js -->
  <div class="simbolo"><!--SIMBOLO--></div>
  <div>
    <h1>Abastece<span>R</span></h1>
    <p>O posto mais barato perto de você, no mapa.</p>
    <div class="precos">
      <div class="p"><small>Gasolina</small>mais barata</div>
      <div class="p"><small>Etanol</small>compensa?</div>
      <div class="p"><small>Diesel</small>no mapa</div>
    </div>
  </div>
</body></html>
